<header class="h-16 shrink-0 border-b border-border bg-background/70 backdrop-blur-xl flex items-center justify-between gap-4 px-8 sticky top-0 z-20">

  <div class="flex items-center gap-2 text-[12.5px] min-w-0">
    <span class="text-faint-foreground font-medium">WebParser</span>
    <i class="pi pi-angle-right text-[10px] text-faint-foreground"></i>
    <span class="text-faint-foreground">{{ page().section }}</span>
    <i class="pi pi-angle-right text-[10px] text-faint-foreground"></i>
    <span class="text-foreground font-semibold truncate">{{ page().title }}</span>
  </div>

  <div class="flex items-center gap-3">
    <div class="search-field hidden md:block">
      <i class="pi pi-search"></i>
      <input type="text" placeholder="Поиск по CRM…" class="field field-sm w-72 bg-surface/80" />
      <kbd class="absolute right-2 top-1/2 -translate-y-1/2 hidden lg:inline-flex h-5 items-center rounded-md border border-border-strong bg-surface-elevated px-1.5 font-mono text-[10px] text-faint-foreground">Ctrl K</kbd>
    </div>

    <div class="hidden lg:flex items-center gap-2 h-8 px-3 rounded-lg border border-border bg-surface/60 text-[11.5px] text-muted-foreground">
      <span class="live-dot"></span>
      Онлайн
      <span class="text-faint-foreground">· {{ today | date:'d MMM, EEE' }}</span>
    </div>

    <a routerLink="/logs" class="btn btn-secondary btn-icon relative" title="Журнал">
      <i class="pi pi-bell text-[13px]"></i>
    </a>
  </div>
</header>
