<header class="h-16 border-b border-zinc-800/50 bg-[#0a0a0a]/80 backdrop-blur-md flex items-center justify-between px-8 sticky top-0 z-10">

  <div class="flex items-center gap-2 text-xs tracking-wide">
    <span class="text-zinc-500 font-medium">BotPanel</span>
    <span class="text-zinc-700">/</span>
    <span class="text-zinc-200 font-semibold">{{ currentPage() }}</span>
  </div>

  <div class="flex items-center gap-4">

    <div class="relative group">
      <input
        type="text"
        placeholder="Поиск..."
        class="bg-zinc-900/40 border border-zinc-800/80 rounded-md px-3 py-1.5 text-xs w-64 text-zinc-300 placeholder:text-zinc-600 focus:outline-none focus:ring-1 focus:ring-zinc-700 focus:bg-zinc-900/80 transition-all"
      >
      <kbd class="absolute right-2 top-1.5 hidden sm:inline-flex h-5 select-none items-center gap-1 rounded border border-zinc-800 bg-zinc-950 px-1.5 font-mono text-[10px] font-medium text-zinc-500 opacity-100">
        <span class="text-xs">⌘</span>K
      </kbd>
    </div>

    <button class="w-8 h-8 flex items-center justify-center border border-zinc-800 rounded-md text-zinc-500 hover:text-white hover:bg-zinc-800/50 transition-all">
      <span class="font-bold text-sm">!</span>
    </button>

  </div>
</header>
