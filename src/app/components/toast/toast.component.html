@if (toast.toasts().length > 0) {
  <div class="fixed bottom-5 right-5 z-[200] flex flex-col gap-2 pointer-events-none">
    @for (t of toast.toasts(); track t.id) {
      <div class="toast pointer-events-auto" [ngClass]="'toast-' + t.type">
        <i class="pi mt-0.5" [ngClass]="toastIcon(t.type)"></i>
        <span class="flex-1 leading-snug">{{ t.message }}</span>
        <button (click)="dismiss(t.id)" class="opacity-50 hover:opacity-100 transition-opacity shrink-0" aria-label="Закрыть">
          <i class="pi pi-times text-[10px]"></i>
        </button>
      </div>
    }
  </div>
}
