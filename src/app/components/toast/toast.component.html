@if (toast.toasts().length > 0) {
  <div class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none">
    @for (t of toast.toasts(); track t.id) {
      <div
        class="flex items-start gap-3 px-4 py-3 rounded-lg shadow-xl min-w-72 max-w-sm text-sm font-medium pointer-events-auto"
        [ngClass]="toastClass(t.type)"
      >
        <span class="flex-1 leading-snug">{{ t.message }}</span>
        <button
          (click)="dismiss(t.id)"
          class="opacity-70 hover:opacity-100 transition-opacity shrink-0 text-base leading-none mt-0.5"
        >✕</button>
      </div>
    }
  </div>
}
