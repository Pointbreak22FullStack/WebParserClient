<div class="modal-backdrop">
  <div class="modal max-w-[440px]">

    <div class="p-6">
      <h2 class="modal-title">{{ isEditMode() ? 'Редактировать' : 'Добавить аккаунт' }}</h2>
      <p class="modal-subtitle">Бот автоматически авторизуется и сохранит сессию</p>
    </div>

    <form [formGroup]="accountForm" class="px-6 pb-6 space-y-4">



      <div class="space-y-4 animate-in fade-in zoom-in-95 duration-200">
        <div class="grid grid-cols-[100px_1fr] gap-2">
          <div class="space-y-1.5">
            <label class="field-label">Код</label>
            <input formControlName="countryCode" type="text" class="field">
          </div>
          <div class="space-y-1.5">
            <label class="field-label">Номер телефона</label>
            <input formControlName="phoneBody" type="text" class="field">
          </div>
        </div>
      </div>


        <div class="space-y-4 animate-in fade-in zoom-in-95 duration-200">
          <div class="grid grid-cols-2 gap-2">
          <div class="space-y-1.5">
            <label class="field-label">Логин</label>
            <input formControlName="login" type="text" class="field">
          </div>
          <div class="space-y-1.5">
            <label class="field-label">Пароль</label>
            <input formControlName="password" type="password" class="field">
          </div>
          </div>
        </div>



      <div class="grid grid-cols-2 gap-4">
        <input formControlName="firstName" placeholder="Имя" class="field">
        <input formControlName="lastName" placeholder="Фамилия" class="field">
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div class="space-y-1.5">
          <label class="field-label">Тип аккаунта (сеть)</label>
          <select formControlName="loginMethod" class="field">
            @for (method of loginMethods; track method.value) {
              <option [ngValue]="method.value">{{ method.label }}</option>
            }
          </select>
        </div>

      <div class="space-y-1.5">
        <label class="field-label">Прокси</label>
        <select formControlName="proxyId" class="field">
          <option [ngValue]="null">Без прокси</option>
          @for (proxy of proxyStore.proxies(); track proxy.id) {
            <option [value]="proxy.id">{{ proxy.ipAddress }}:{{ proxy.port }}</option>
          }
        </select>
      </div>
      </div>
      <div class="space-y-1.5">
        <label class="field-label">Описание</label>
        <textarea formControlName="description" rows="2" class="field"></textarea>
      </div>
    </form>

    <div class="modal-footer">
      <button (click)="closeModal.emit()" class="btn btn-ghost">Отмена</button>
      <button (click)="onSave()" class="btn btn-primary">
        {{ isEditMode() ? 'Сохранить' : 'Добавить аккаунт' }}
      </button>
    </div>
  </div>
</div>
