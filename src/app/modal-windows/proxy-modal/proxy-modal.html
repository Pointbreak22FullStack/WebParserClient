<div class="modal-backdrop">

  <div class="modal max-w-[440px]">

    <div class="p-6">
      <h2 class="modal-title">
        {{ isEditMode() ? 'Редактировать прокси' : 'Добавить прокси' }}
      </h2>
      <p class="modal-subtitle">Введите данные прокси-сервера</p>
    </div>

    <div [formGroup]="proxyForm" class="px-6 pb-6 space-y-5">

      <div class="grid grid-cols-2 gap-4">
        <div class="space-y-1.5">
          <label class="field-label">IP-адрес</label>
          <input
            formControlName="ipAddress"
            type="text"
            placeholder="192.168.1.1"
            class="field"
          >
        </div>
        <div class="space-y-1.5">
          <label class="field-label">Порт</label>
          <input
            formControlName="port"
            type="text"
            placeholder="8080"
            class="field"
          >
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div class="space-y-1.5">
          <label class="field-label">Логин</label>
          <input
            formControlName="login"
            type="text"
            placeholder="user"
            autocomplete="off"
            class="field"
          >
        </div>
        <div class="space-y-1.5">
          <label class="field-label">Пароль</label>
          <input
            formControlName="password"
            type="password"
            placeholder="••••••••"
            autocomplete="new-password"
            class="field"
          >
        </div>
      </div>

      <div class="space-y-1.5">
        <label class="field-label">Тип</label>
        <div class="relative">
          <select formControlName="type" class="field">
            <option [ngValue]="0">Http</option>
            <option [ngValue]="1">Socks5</option>
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-zinc-500">
            <svg class="h-3 w-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
            </svg>
          </div>
        </div>
      </div>

    </div>

    <div class="modal-footer">
      <button
        (click)="closeModal.emit()"
        class="btn btn-ghost"
      >
        Отмена
      </button>
      <button (click)="onSubmit()" [disabled]="proxyForm.invalid" class="btn btn-primary">
        {{ isEditMode() ? 'Сохранить изменения' : 'Добавить прокси' }}
      </button>
    </div>

  </div>
</div>
