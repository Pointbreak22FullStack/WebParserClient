<div class="p-8 space-y-6 animate-in fade-in duration-500">

  <div class="mb-8">
    <h1 class="text-2xl font-bold text-white tracking-tight">Накрутка лайков / дизлайков</h1>
    <p class="text-zinc-500 text-[10px] mt-1 font-mono uppercase tracking-widest">FR2.1 — FR2.3</p>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 items-start">

    <section class="bg-[#0d0d0d] border border-zinc-800/50 rounded-xl p-6 shadow-xl space-y-6">
      <h2 class="text-sm font-semibold text-white">Новое задание</h2>

      <div class="space-y-4">
        <div class="space-y-1.5">
          <label class="text-xs font-medium text-zinc-400">ID ответа</label>
          <input
            type="text"
            placeholder="Например: 4521"
            class="w-full bg-zinc-900/50 border border-zinc-800 rounded-lg px-3 py-2.5 text-xs text-zinc-300 placeholder:text-zinc-600 focus:outline-none focus:ring-1 focus:ring-zinc-700 transition-all"
          >
        </div>

        <div class="space-y-1.5">
          <label class="text-xs font-medium text-zinc-400">Тип действия</label>
          <div class="flex p-1 bg-zinc-900/80 border border-zinc-800 rounded-lg">
            <button
              type="button"
              (click)="actionType.set('like')"
              [class]="actionType() === 'like' ? 'bg-white text-black shadow-lg' : 'text-zinc-500 hover:text-zinc-300'"
              class="flex-1 flex items-center justify-center gap-2 py-1.5 rounded-md text-xs font-bold transition-all"
            >
              👍 Лайк
            </button>
            <button
              type="button"
              (click)="actionType.set('dislike')"
              [class]="actionType() === 'dislike' ? 'bg-white text-black shadow-lg' : 'text-zinc-500 hover:text-zinc-300'"
              class="flex-1 flex items-center justify-center gap-2 py-1.5 rounded-md text-xs font-bold transition-all"
            >
              👎 Дизлайк
            </button>
          </div>
        </div>

        <div class="space-y-1.5">
          <label class="text-xs font-medium text-zinc-400">Количество</label>
          <input
            type="number"
            value="50"
            class="w-full bg-zinc-900/50 border border-zinc-800 rounded-lg px-3 py-2.5 text-xs text-zinc-300 focus:outline-none focus:ring-1 focus:ring-zinc-700 transition-all"
          >
        </div>

        <div class="space-y-1.5">
          <label class="text-xs font-medium text-zinc-400">Задержка</label>
          <input
            type="text"
            placeholder="3 – 7 секунд (случайно)"
            disabled
            class="w-full bg-zinc-900/30 border border-zinc-800/50 rounded-lg px-3 py-2.5 text-xs text-zinc-500 cursor-not-allowed"
          >
          <p class="text-[10px] text-zinc-600 italic">Случайная задержка снижает риск бана</p>
        </div>

        <button class="w-full bg-white hover:bg-zinc-200 text-black py-3 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-2 shadow-xl shadow-white/5 group">
          <i class="pi pi-play text-[10px] group-hover:scale-110 transition-transform"></i> Запустить
        </button>
      </div>
    </section>

    <section class="bg-[#0d0d0d] border border-zinc-800/50 rounded-xl p-6 shadow-xl flex flex-col h-full">
      <h2 class="text-sm font-semibold text-white mb-5">Статус выполнения</h2>

      <div class="bg-zinc-900/40 border border-zinc-800/80 rounded-lg p-5 mb-6">
        <div class="flex justify-between items-center mb-4">
          <div class="text-[11px] text-zinc-300 font-medium">Выполняется задание</div>
          <div class="text-[10px] text-zinc-500 font-mono italic">ID #4521</div>
        </div>
        <div class="text-[11px] text-yellow-500 mb-3 flex items-center gap-2">
          <span>👍</span> Лайки на ответ #4521 · 32/50 завершено
        </div>
        <div class="w-full h-1.5 bg-zinc-800 rounded-full overflow-hidden">
          <div class="bg-blue-500 h-full w-[64%] shadow-[0_0_8px_rgba(59,130,246,0.5)] transition-all duration-1000"></div>
        </div>
      </div>

      <div class="space-y-2.5 overflow-y-auto max-h-[300px] pr-2 custom-scrollbar">
        @for (log of executionLogs(); track log.id) {
          <div class="flex items-start gap-4 font-mono text-[10px] group">
            <span class="text-zinc-600 shrink-0">{{ log.time }}</span>
            <span [style.color]="log.color" class="leading-relaxed">
              {{ log.message }}
            </span>
          </div>
        }
      </div>
    </section>

  </div>
</div>
