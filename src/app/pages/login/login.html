<div class="min-h-screen bg-[#050505] flex items-center justify-center p-4">
  <div class="w-full max-w-[400px] bg-[#0d0d0d] border border-zinc-800/50 rounded-2xl p-8 shadow-2xl">
    <div class="flex justify-center mb-6">
      <div class="w-10 h-10 bg-white rounded-lg flex items-center justify-center shadow-lg shadow-white/5">
        <span class="text-black font-bold text-xl">!</span>
      </div>
    </div>

    <div class="text-center mb-8">
      <h1 class="text-xl font-semibold text-white">
        Добро пожаловать в <span class="text-[#84cc16]">AutoPanel</span>
      </h1>
      <div class="mt-4 space-y-1">
        <p class="text-sm text-zinc-200 font-medium">Войдите в свою учетную запись</p>
        <p class="text-[11px] text-zinc-500 leading-relaxed px-4">
          Введите свой адрес электронной почты ниже, чтобы войти в свою учетную запись
        </p>
      </div>
    </div>

    <form (ngSubmit)="onLogin()" class="space-y-5">

      @if (errorMessage()) {
        <div class="bg-red-500/10 border border-red-500/20 text-red-500 text-[11px] p-3 rounded-lg text-center">
          {{ errorMessage() }}
        </div>
      }

      <div class="space-y-2">
        <label class="text-xs font-medium text-zinc-400 ml-1">Логин</label>
        <input
          name="email"
          [(ngModel)]="loginData.email"
          type="email"
          placeholder="m@example.com"
          required
          class="w-full bg-zinc-900/50 border border-zinc-800 rounded-lg px-4 py-2.5 text-sm text-zinc-200 placeholder:text-zinc-600 focus:outline-none focus:ring-1 focus:ring-[#84cc16]/50 focus:border-[#84cc16]/50 transition-all"
        >
      </div>

      <div class="space-y-2">
        <div class="flex justify-between items-center px-1">
          <label class="text-xs font-medium text-zinc-400">Пароль</label>
          <button type="button" (click)="togglePassword()" class="text-[10px] text-zinc-500 hover:text-zinc-300 transition-colors">
            {{ showPassword() ? 'Скрыть' : 'Показать' }}
          </button>
        </div>
        <input
          name="password"
          [(ngModel)]="loginData.password"
          [type]="showPassword() ? 'text' : 'password'"
          required
          class="w-full bg-zinc-900/50 border border-zinc-800 rounded-lg px-4 py-2.5 text-sm text-zinc-200 focus:outline-none focus:ring-1 focus:ring-[#84cc16]/50 focus:border-[#84cc16]/50 transition-all"
        >
      </div>

      <button
        type="submit"
        [disabled]="isLoading()"
        class="w-full bg-[#84cc16] hover:bg-[#a3e635] disabled:opacity-50 disabled:cursor-not-allowed text-black font-semibold py-2.5 rounded-lg text-sm transition-colors mt-2 shadow-lg shadow-[#84cc16]/10"
      >
        @if (isLoading()) {
          <span>Вход...</span>
        } @else {
          <span>Войти</span>
        }
      </button>
    </form>

    <div class="mt-8 text-center">
      <p class="text-[11px] text-zinc-600">
        У вас нет аккаунта?
        <a routerLink="/register" class="text-zinc-400 hover:text-white underline underline-offset-4 transition-colors">Зарегистрируйтесь</a>
      </p>
    </div>

  </div>
</div>
