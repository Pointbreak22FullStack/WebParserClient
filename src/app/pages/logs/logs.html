<div class="page">
  <div class="page-header">
    <div>
      <span class="page-eyebrow"><i class="pi pi-file text-[10px]"></i> Система</span>
      <h1 class="page-title mt-1.5">Системные логи</h1>
      <p class="page-subtitle">История событий и работы системы</p>
    </div>
    <button (click)="clearLogs()"
            class="btn btn-secondary">
      Очистить логи
    </button>
  </div>

  <section class="card table-card">
    <div class="overflow-x-auto">
      <table class="crm-table whitespace-nowrap">
        <thead>
        <tr>
          <th class="w-32">Время</th>
          <th class="">Событие</th>
          <th class="text-right"></th>
        </tr>
        </thead>

        <tbody>
          @for (log of logs(); track log.id) {
            @let color = getColorClass(log.type);
            <tr class="hover:bg-zinc-800/20 transition-colors group">
              <td class="">
                <span class="text-xs text-zinc-500 font-mono italic">{{ log.time }}</span>
              </td>

              <td class="">
                <div class="flex items-center gap-3">
                  <div class="w-1.5 h-1.5 rounded-full shadow-sm" [ngClass]="'bg-' + color"></div>
                  <span class="text-xs tracking-wide transition-colors" [ngClass]="'text-' + color">
                    {{ log.message }}
                  </span>
                </div>
              </td>

              <td class="text-right">
                <button class="text-zinc-600 group-hover:text-zinc-400 transition-colors">
                  <i class="pi pi-ellipsis-h text-xs"></i>
                </button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>

    @if (logs().length === 0) {
      <div class="empty-state">
        <div class="empty-icon"><i class="pi pi-file"></i></div>
        <p class="empty-title">Событий пока нет</p>
        <p class="empty-text">Здесь появится история работы системы и парсеров.</p>
      </div>
    }
  </section>
</div>
