<div class="p-8 space-y-6 animate-in fade-in duration-500">
  <div class="flex justify-between items-start mb-6">
    <div>
      <h1 class="text-2xl font-bold text-white tracking-tight">Системные логи</h1>
      <p class="text-zinc-500 text-xs mt-1">История событий и работы системы</p>
    </div>
    <button (click)="clearLogs()"
            class="bg-[#1a1a1a] hover:bg-zinc-800 text-zinc-300 border border-zinc-800 px-4 py-2.5 rounded-lg text-xs font-bold transition-all flex items-center gap-2 shadow-sm">
      Очистить логи
    </button>
  </div>

  <section class="bg-[#111111] border border-zinc-800/80 rounded-xl overflow-hidden shadow-2xl">
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse whitespace-nowrap">
        <thead class="bg-[#0d0d0d] border-b border-zinc-800/80 text-zinc-500">
        <tr>
          <th class="px-6 py-4 text-xs font-medium w-32">Время</th>
          <th class="px-6 py-4 text-xs font-medium">Событие</th>
          <th class="px-6 py-4 text-xs font-medium text-right"></th>
        </tr>
        </thead>

        <tbody class="divide-y divide-zinc-800/40 font-sans">
          @for (log of logs(); track log.id) {
            @let color = getColorClass(log.type);
            <tr class="hover:bg-zinc-800/20 transition-colors group">
              <td class="px-6 py-4">
                <span class="text-xs text-zinc-500 font-mono italic">{{ log.time }}</span>
              </td>

              <td class="px-6 py-4">
                <div class="flex items-center gap-3">
                  <div class="w-1.5 h-1.5 rounded-full shadow-sm" [ngClass]="'bg-' + color"></div>
                  <span class="text-xs tracking-wide transition-colors" [ngClass]="'text-' + color">
                    {{ log.message }}
                  </span>
                </div>
              </td>

              <td class="px-6 py-4 text-right">
                <button class="text-zinc-600 group-hover:text-zinc-400 transition-colors">
                  <i class="pi pi-ellipsis-h text-xs"></i>
                </button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>

    @if (logs().length === 0) {
      <div class="py-20 text-center">
        <p class="text-zinc-600 text-xs">Событий пока не зафиксировано</p>
      </div>
    }
  </section>
</div>
