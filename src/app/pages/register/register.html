<div class="relative min-h-screen overflow-hidden bg-background flex items-center justify-center p-4">
  <div class="pointer-events-none absolute inset-0 bg-grid"></div>
  <div class="glow-orb w-[520px] h-[520px] -top-64 left-1/2 -translate-x-1/2"></div>
  <div class="card relative w-full max-w-[420px] !rounded-[20px] p-8">

    <div class="flex justify-center mb-6">
      <div class="w-12 h-12 rounded-[14px] grid place-items-center bg-gradient-to-br from-accent-300 via-accent-500 to-accent-600 shadow-[inset_0_1px_0_rgb(255_255_255/0.45),0_12px_30px_-8px_var(--color-accent-500)]">
        <span class="font-display text-[#0b1203] font-extrabold text-xl">A</span>
      </div>
    </div>

    <div class="text-center mb-8">
      <h1 class="font-display text-[22px] font-bold text-foreground tracking-tight">
        Добро пожаловать в <span class="text-gradient">WebParser</span>
      </h1>
      <div class="mt-4 space-y-1">
        <p class="text-sm text-zinc-200 font-medium">Создать аккаунт</p>
        <p class="text-[11px] text-zinc-500 leading-relaxed px-4">
          Введите свои данные ниже, чтобы создать учетную запись
        </p>
      </div>
    </div>

    <form (ngSubmit)="onRegister()" class="space-y-4">
      @if (errorMessage()) {
        <div class="bg-red-500/10 border border-red-500/20 text-red-500 text-[11px] p-3 rounded-lg text-center">
          {{ errorMessage() }}
        </div>
      }
      <div class="space-y-2">
        <label class="field-label !mb-0 ml-1">Имя</label>
        <input
          name="name"
          [(ngModel)]="registerData.name"
          type="text"
          placeholder="Никита"
          required
          class="field !h-11"
        >
      </div>

      <div class="space-y-2">
        <label class="field-label !mb-0 ml-1">Логин</label>
        <input
          name="email"
          [(ngModel)]="registerData.email"
          type="email"
          placeholder="m@example.com"
          required
          class="field !h-11"
        >
      </div>

      <div class="space-y-2">
        <label class="field-label !mb-0 ml-1">Пароль</label>
        <input
          name="password"
          [(ngModel)]="registerData.password"
          type="password"
          required
          class="field !h-11"
        >
      </div>

      <div class="space-y-2">
        <label class="field-label !mb-0 ml-1">Подтвердите пароль</label>
        <input
          name="confirmPassword"
          [(ngModel)]="registerData.confirmPassword"
          type="password"
          required
          class="field !h-11"
        >
      </div>

      <button
        type="submit"
        [disabled]="isLoading()"
        class="btn btn-primary w-full !h-11 mt-2 text-[13.5px]"
      >
        {{ isLoading() ? 'Создание...' : 'Создать аккаунт' }}
      </button>
    </form>

    <div class="mt-8 text-center">
      <p class="text-[11px] text-zinc-600">
        У вас уже есть аккаунт?
        <a routerLink="/login" class="text-zinc-400 hover:text-white underline underline-offset-4 transition-colors">Войти</a>
      </p>
    </div>

  </div>
</div>
